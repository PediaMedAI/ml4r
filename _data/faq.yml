# FAQ entries, grouped. Answers are markdown.
- group: "Submissions"
  items:
    - q: "Is the workshop archival? Can I submit my paper elsewhere later?"
      a: "No, ML4R is **non-archival**. Accepted papers are posted publicly on OpenReview and on this website, and authors are free to submit extended versions to archival venues. Papers already published or accepted at an archival venue, including the ICLR 2027 main conference, will not be considered."
    - q: "What is the difference between the Long Paper and Tiny Paper tracks?"
      a: "Long papers have 6 to 9 pages of main text in the ICLR format; selected long papers are presented as orals. Tiny papers are up to 2 pages and are meant for late-breaking work, modest self-contained results, re-analyses, datasets, case studies, or clinical and patient perspectives. Tiny papers are presented as posters, and the best ones receive spotlight talks."
    - q: "How is reviewing done?"
      a: "Every submission receives a double-blind review from at least three reviewers on OpenReview. Organizers do not review or decide on submissions from their own institutions or with any other conflict; papers authored by an organizer are handled by an organizer from another institution and reviewed only by non-organizers."
    - q: "Can I use LLMs when writing or reviewing?"
      a: "We follow the ICLR 2027 AI policy. AI assistance is permitted, but submissions must be primarily human-authored and authors are responsible for all content. **AI-generated tiny papers are not allowed.** AI systems may not be primary authors or reviewers, and reviewers may not upload submissions to LLM services that do not preserve privacy."
    - q: "I am a clinician or geneticist new to ML conferences. Is this workshop for me?"
      a: "Yes. The Tiny Paper track is designed for authors outside the traditional ML conference circuit, and we especially welcome clinical, genetic, and patient perspectives on ML problems."
- group: "Attending"
  items:
    - q: "Is the workshop in person?"
      a: "Yes, ML4R is an in-person workshop at ICLR 2027. If an author cannot attend, for example because of visa problems, we will display their poster on site and host a pre-recorded video on this website."
    - q: "Can I follow remotely?"
      a: "All accepted papers and posters will be public before the workshop. With speakers' permission, keynotes and oral presentations will be recorded and posted here and on the ICLR virtual platform. Questions can be submitted in advance through this website and live through an online Q&A channel."
    - q: "Is there travel funding?"
      a: "Yes. We will cover registration and travel for participants who otherwise could not attend, prioritizing researchers from under-represented groups and low-resource regions, junior and first-time authors, and patient advocates. The application form will be posted here."
    - q: "What are the mentoring tables?"
      a: "During lunch, we pair first-time authors, clinicians, and students with keynote speakers and senior researchers for small-group conversations."
    - q: "Is there a code of conduct?"
      a: "All participants and speakers must follow the [ICLR Code of Conduct](https://iclr.cc/public/CodeOfConduct)."
